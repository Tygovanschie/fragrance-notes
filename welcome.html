<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fragrance Notes</title>
<link rel="icon" href="icons/32.png">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="base.css">
<style>
  /* Opens once after installing. Same look as the settings page and fragrancenotes.app. */

  /* Header, buttons, switch and colours: base.css (shared with the settings and favourites pages). */

  main.wrap { padding:32px 0 64px; }   /* exactly like the settings page's content area */
  .steps { list-style:none; margin:0 0 18px; padding:0; display:grid; grid-template-columns:repeat(3, 1fr); gap:18px; }
  .steps li { background:var(--card); border:1px solid var(--line); border-radius:22px; padding:24px 28px; }
  .steps .n { display:grid; place-items:center; width:32px; height:32px; border-radius:50%; background:var(--accent); color:#fff; font:700 15px/1 var(--display); margin-bottom:14px; }
  .steps h2 { margin:0 0 4px; font:750 24px/1.15 var(--display); letter-spacing:-0.02em; }
  .steps p { margin:0; color:var(--muted); font-size:14px; }

  .share { background:var(--card); border:1px solid var(--line); border-radius:22px; padding:24px 28px; display:flex; gap:24px; align-items:center; }
  .share .l { flex:1; min-width:0; }
  .share h2 { margin:0 0 4px; font:750 24px/1.15 var(--display); letter-spacing:-0.02em; }
  .share b { display:block; font-weight:600; margin-top:8px; }
  .share p { margin:2px 0 0; color:var(--muted); font-size:13.5px; }

  .end { display:flex; gap:12px; flex-wrap:wrap; margin-top:18px; }

  @media (max-width:760px) { .steps { grid-template-columns:1fr; } .share { flex-direction:column; align-items:flex-start; } }
  .perm { margin-bottom:24px; }
  .share.facts { margin-top:18px; }
  .share.facts b { margin-top:0; }
  .perm .btn { flex:none; }
  .perm.ok h2 { display:none; }
  .choice { border-width:2px; }
  .choice p { font-size:14px; line-height:1.5; }
  .choice-btns { display:flex; flex-direction:column; gap:8px; flex:none; }
  .choice-btns .btn { min-width:210px; }
  .choice-btns[hidden], .choice b[hidden] { display:none; }
  @media (max-width:760px) { .choice-btns { flex-direction:row; flex-wrap:wrap; } .choice-btns .btn { min-width:0; } }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="bar">
      <span class="brand"><img src="icons/128.png" alt="">Fragrance Notes</span>
      <a class="site" href="https://fragrancenotes.app" target="_blank" rel="noopener">fragrancenotes.app</a>
    </div>
    <h1 data-i18n="wel_title"></h1>
    <p class="sub" data-i18n="wel_sub"></p>
  </div>
  <div class="strip" aria-hidden="true">
    <i style="--w:100;--c:#fb4b2b"></i><i style="--w:69;--c:#ee3a3d"></i><i style="--w:68;--c:#7a4513"></i><i style="--w:64;--c:#7b4a3c"></i>
    <i style="--w:60;--c:#f6f04e"></i><i style="--w:57;--c:#847586"></i><i style="--w:56;--c:#e5d9ea"></i><i style="--w:52;--c:#9ee6ee"></i>
  </div>
</header>

<main class="wrap">
  <section class="share perm" id="perm" hidden>
    <div class="l">
      <h2 data-i18n="wel_permH"></h2>
      <p data-i18n="wel_permD"></p>
    </div>
    <button class="btn primary" id="permGo" data-i18n="wel_permGo"></button>
  </section>

  <ol class="steps">
    <li><span class="n">1</span><h2 data-i18n="wel_s1_t"></h2><p data-i18n="wel_s1_d"></p></li>
    <li><span class="n">2</span><h2 data-i18n="wel_s2_t"></h2><p data-i18n="wel_s2_d"></p></li>
    <li><span class="n">3</span><h2 data-i18n="wel_s3_t"></h2><p data-i18n="wel_s3_d"></p></li>
  </ol>

  <!-- One choice for both kinds of sharing (prices and the open perfume database), like the one switch in Settings → Data. -->
  <section class="share choice" id="choice">
    <div class="l">
      <h2 data-i18n="wel_choiceT"></h2>
      <p data-i18n="wel_choiceD"></p>
      <p><a id="seeDb" href="https://fragrancenotes.app/database" target="_blank" rel="noopener" data-i18n="wel_seeDb"></a></p>
      <b id="choiceState" hidden></b>
    </div>
    <div class="choice-btns" id="choiceBtns">
      <button class="btn primary" id="choiceYes" data-i18n="wel_yes"></button>
      <button class="btn quiet" id="choiceNo" data-i18n="wel_no"></button>
    </div>
  </section>

  <div class="end">
    <button class="btn primary" id="openSettings" data-i18n="p_settings"></button>
    <a class="btn quiet" href="https://fragrancenotes.app/privacy.html" target="_blank" rel="noopener" id="privacy">Privacy</a>
  </div>
</main>
<script src="settings.js"></script>
<script src="i18n-panel.js"></script>
<script src="i18n-settings.js"></script>
<script src="welcome.js"></script>
</body>
</html>
