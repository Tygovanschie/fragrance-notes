<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fragrance Notes – Favourites</title>
<link rel="icon" href="icons/32.png">
<link rel="stylesheet" href="fonts.css">
<style>
  /* Favourites: saved with the ♥ in the panel, opened from the toolbar menu. Same look as the settings page. */
  :root { --bg:#f4eef3; --card:#fff; --fg:#2b1426; --muted:#6b5766; --line:#e3d6e0; --accent:#7e2f63; --accent-deep:#4a1a3b; --soft:#c58bb0; --chip:#f4eef3;
    --display:'Bricolage Grotesque', system-ui, sans-serif; --text:'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.55 var(--text); }
  a { color:var(--accent); }
  :focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  [hidden] { display:none !important; }
  .wrap { max-width:1120px; margin:0 auto; padding:0 28px; }

  header { padding:22px 0 0; }
  header .bar { display:flex; align-items:center; justify-content:space-between; gap:16px; }
  .brand { display:flex; align-items:center; gap:10px; font:700 17px/1 var(--display); color:var(--fg); text-decoration:none; }
  .brand img { width:30px; height:30px; }
  .site { font-size:14px; font-weight:600; text-decoration:none; padding:8px 16px; border-radius:999px; box-shadow:inset 0 0 0 1.5px var(--soft); }
  .site:hover { background:#fff; color:var(--accent-deep); }
  h1 { margin:34px 0 8px; font:800 clamp(34px, 4.6vw, 52px)/1 var(--display); letter-spacing:-0.035em; }
  .sub { margin:0 0 28px; color:var(--muted); font-size:16px; max-width:40em; }
  .strip { display:flex; height:8px; }
  .strip i { flex:var(--w) 1 0; background:var(--c); }
  main.wrap { padding:32px 0 96px; }

  .btn { display:inline-flex; align-items:center; gap:8px; border:0; border-radius:999px; padding:10px 20px; font:600 14px/1 var(--text); cursor:pointer; text-decoration:none; }
  .btn.primary { background:var(--accent); color:#fff; }
  .btn.primary:hover:not(:disabled) { background:var(--accent-deep); }
  .btn.primary:disabled { opacity:.45; cursor:default; }
  .btn.quiet { background:transparent; color:var(--accent); box-shadow:inset 0 0 0 1.5px var(--soft); }
  .btn.quiet:hover { background:#fff; color:var(--accent-deep); }

  /* The list. */
  .grid { list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(auto-fill, minmax(240px, 1fr)); gap:16px; }
  .card { position:relative; background:var(--card); border:1px solid var(--line); border-radius:22px; padding:16px; display:flex; gap:14px; align-items:center; }
  .card.sel { border-color:var(--accent); box-shadow:0 0 0 1.5px var(--accent); }
  .card img { width:56px; height:70px; object-fit:contain; flex:none; border-radius:10px; background:#fff; }
  .card .l { flex:1; min-width:0; }
  .card b { display:block; font:700 16px/1.2 var(--display); letter-spacing:-0.01em; overflow-wrap:anywhere; }
  .card .acts { display:flex; gap:12px; margin-top:8px; font-size:13px; }
  .linkbtn { border:0; background:none; padding:0; font:inherit; color:var(--accent); cursor:pointer; }
  .linkbtn:hover { text-decoration:underline; }
  .linkbtn.rm { color:var(--muted); }
  .pick { position:absolute; top:12px; inset-inline-end:12px; width:18px; height:18px; accent-color:var(--accent); cursor:pointer; }
  .empty { background:var(--card); border:1px solid var(--line); border-radius:22px; padding:28px; color:var(--muted); }

  /* Compare bar, stays at the bottom of the window. */
  .bar-cmp { position:sticky; bottom:16px; margin-top:24px; display:flex; align-items:center; gap:16px; justify-content:space-between;
    background:var(--fg); color:#fff; border-radius:999px; padding:10px 10px 10px 24px; box-shadow:0 8px 24px rgba(43,20,38,.18); }
  .bar-cmp span { font-size:14px; }
  .bar-cmp .btn.primary { background:#fff; color:var(--accent-deep); }

  /* Details and comparison. */
  .back { margin-bottom:20px; }
  .detail { display:flex; justify-content:center; }
  .detail-tools { display:flex; flex-wrap:wrap; gap:12px 20px; align-items:center; justify-content:center; margin-bottom:18px; font-size:14px; }
  .detail-tools .seen { color:var(--muted); }
  .detail-tools .seen b { color:var(--fg); }
  .loading, .failed { color:var(--muted); padding:24px 0; }
  select.add { font:600 14px/1 var(--text); color:var(--accent); background:var(--card); border:1.5px dashed var(--soft); border-radius:999px; padding:10px 14px; cursor:pointer; max-width:100%; }
  select.add:hover { border-color:var(--accent); }

  .cmp-wrap { overflow-x:auto; }
  .cmp { width:100%; min-width:640px; border-collapse:separate; border-spacing:0; background:var(--card); border:1px solid var(--line); border-radius:22px; overflow:hidden; table-layout:fixed; }
  .cmp col.lab { width:170px; }
  .cmp col.slotcol { width:0; }
  .cmp.cols2 col.slotcol { width:24%; }
  .cmp th, .cmp td { padding:12px 16px; vertical-align:top; text-align:start; border-top:1px solid var(--line); font-size:14px; }
  .cmp td.slot { padding:12px 0; }
  .cmp.cols2 td.slot { padding:12px 16px; }
  .cmp tr:first-child th, .cmp tr:first-child td { border-top:0; }
  .cmp th { color:var(--muted); font-weight:600; font-size:13px; }
  .cmp tr.sec th { padding:18px 16px 8px; font:750 18px/1.2 var(--display); letter-spacing:-0.01em; color:var(--fg); background:var(--bg); border-top:1px solid var(--line); }
  .cmp .who { position:relative; }
  .cmp .who img { width:64px; height:80px; object-fit:contain; border-radius:10px; background:#fff; display:block; margin-bottom:8px; }
  .cmp .who a { font:700 18px/1.2 var(--display); letter-spacing:-0.01em; text-decoration:none; color:var(--fg); overflow-wrap:anywhere; }
  .cmp .who a:hover { color:var(--accent); }
  .cmp .who small { display:block; color:var(--muted); font-size:13px; margin-top:4px; }
  .cmp .who .x { position:absolute; top:8px; inset-inline-end:8px; border:0; background:var(--chip); color:var(--muted); width:28px; height:28px; border-radius:50%; font-size:18px; line-height:1; cursor:pointer; }
  .cmp .who .x:hover { background:var(--accent); color:#fff; }
  .cmp td.slot { vertical-align:middle; }
  .cmp small { color:var(--muted); font-size:12.5px; }
  .price b { font:700 18px/1.2 var(--display); }
  .tag { display:inline-block; margin-inline-start:8px; padding:2px 9px; border-radius:999px; background:var(--accent); color:#fff; font-size:12px; font-weight:600; vertical-align:middle; }
  .cmp td > .tag { margin:6px 0 0; }

  .cmp tr.acc th, .cmp tr.acc td { padding-top:7px; padding-bottom:7px; border-top-color:transparent; }
  .cmp tr.acc th { display:flex; align-items:center; gap:8px; color:var(--fg); font-weight:500; }
  .cmp tr.acc th i { width:10px; height:10px; border-radius:50%; flex:none; box-shadow:inset 0 0 0 1px rgba(43,20,38,.16); }
  .abar { height:12px; border-radius:999px; background:var(--chip); overflow:hidden; margin-top:3px; }
  .abar span { display:block; height:100%; border-radius:999px; background:var(--accent); box-shadow:inset 0 0 0 1px rgba(43,20,38,.12); }

  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { display:inline-flex; align-items:center; gap:6px; padding:3px 10px 3px 4px; border-radius:999px; background:var(--chip); font-size:13px; }
  .chip:not(:has(img)) { padding-inline-start:10px; }
  .chip img { width:24px; height:24px; border-radius:50%; object-fit:cover; background:#fff; }
  .chip.nb { cursor:pointer; }
  .chip.nb:hover, .chip.nb.on { box-shadow:inset 0 0 0 1.5px var(--accent); }
  .chip.shared { background:var(--accent); color:#fff; }
  .chip.shared.nb:hover, .chip.shared.nb.on { box-shadow:inset 0 0 0 1.5px var(--accent-deep); }
  .none { color:var(--muted); }

  tr.noterow td { background:var(--bg); }
  .notepop { display:flex; gap:14px; align-items:flex-start; font-size:13.5px; }
  .notepop img { width:56px; height:56px; border-radius:12px; object-fit:cover; background:#fff; flex:none; }
  .notepop .nn { display:flex; gap:12px; align-items:baseline; justify-content:space-between; font:700 16px/1.3 var(--display); margin-bottom:4px; }
  .notepop .nn a { font:600 13px/1 var(--text); }
  .notepop .lat { font-weight:400; color:var(--muted); font-size:13px; }
  .notepop .nl { color:var(--muted); font-size:12px; margin-top:6px; }
  .muted { color:var(--muted); }

  .score { display:flex; align-items:baseline; gap:4px; }
  .score b { font:800 22px/1 var(--display); letter-spacing:-0.02em; }
  .score .of { color:var(--muted); font-size:13px; }
  .scale { position:relative; height:6px; border-radius:999px; background:var(--chip); margin:8px 0 6px; }
  .scale span { position:absolute; top:50%; width:12px; height:12px; border-radius:50%; background:var(--accent); transform:translate(-50%, -50%); box-shadow:0 0 0 2px var(--card); }
  [dir=rtl] .scale span { transform:translate(50%, -50%); }
  .spread { display:flex; height:6px; border-radius:999px; overflow:hidden; gap:1px; margin-bottom:4px; }
  .spread i { background:var(--accent); min-width:1px; }
  .wear { display:grid; gap:4px; }
  .wl { display:grid; grid-template-columns:64px 1fr; gap:8px; align-items:center; font-size:13px; color:var(--muted); }
  .wl .abar { height:8px; margin:0; }
  .wl.hi { color:var(--fg); font-weight:600; }

  @media (max-width:760px) { .cmp th { width:110px; } .bar-cmp { border-radius:22px; flex-direction:column; align-items:stretch; padding:14px; } }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="bar">
      <span class="brand"><img src="icons/128.png" alt="">Fragrance Notes</span>
      <a class="site" href="https://fragrancenotes.app" target="_blank" rel="noopener">fragrancenotes.app</a>
    </div>
    <h1 data-i18n="fav_title"></h1>
    <p class="sub" data-i18n="fav_sub"></p>
  </div>
  <div class="strip" aria-hidden="true">
    <i style="--w:100;--c:#fb4b2b"></i><i style="--w:69;--c:#ee3a3d"></i><i style="--w:68;--c:#7a4513"></i><i style="--w:64;--c:#7b4a3c"></i>
    <i style="--w:60;--c:#f6f04e"></i><i style="--w:57;--c:#847586"></i><i style="--w:56;--c:#e5d9ea"></i><i style="--w:52;--c:#9ee6ee"></i>
  </div>
</header>

<main class="wrap">
  <section id="listView">
    <ul class="grid" id="grid"></ul>
    <p class="empty" id="empty" data-i18n="fav_empty" hidden></p>
    <div class="bar-cmp" id="cmpBar" hidden>
      <span id="cmpHint"></span>
      <button class="btn primary" id="cmpGo" data-i18n="fav_compare" disabled></button>
    </div>
  </section>

  <section id="itemView" hidden>
    <button class="btn quiet back" id="back"></button>
    <div id="itemBody"></div>
  </section>
</main>
<script src="settings.js"></script>
<script src="i18n-panel.js"></script>
<script src="i18n-settings.js"></script>
<script src="panel-ui.js"></script>
<script src="favourites.js"></script>
</body>
</html>
