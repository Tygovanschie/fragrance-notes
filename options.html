<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fragrance Notes</title>
<link rel="icon" href="icons/32.png">
<link rel="stylesheet" href="fonts.css">
<style>
  /* Same look as fragrancenotes.app: plum on lilac paper, Bricolage Grotesque headings, Figtree text.
     The fonts ship with the extension (fonts/, SIL Open Font License), so this page loads nothing from the web. */

  :root { --bg:#f4eef3; --card:#fff; --fg:#2b1426; --muted:#6b5766; --line:#e3d6e0; --accent:#7e2f63; --accent-deep:#4a1a3b; --soft:#c58bb0; --chip:#f4eef3;
    --display:'Bricolage Grotesque', system-ui, sans-serif; --text:'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.55 var(--text); }
  a { color:var(--accent); }
  :focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  .wrap { max-width:1120px; margin:0 auto; padding:0 28px; }

  /* ---------- header ---------- */
  header.top { padding:22px 0 0; }
  header .bar { display:flex; align-items:center; justify-content:space-between; gap:16px; }
  .brand { display:flex; align-items:center; gap:10px; font:700 17px/1 var(--display); color:var(--fg); text-decoration:none; }
  .brand img { width:30px; height:30px; }
  .site { font-size:14px; font-weight:600; text-decoration:none; padding:8px 16px; border-radius:999px; box-shadow:inset 0 0 0 1.5px var(--soft); }
  .site:hover { background:#fff; color:var(--accent-deep); }
  header h1 { margin:34px 0 8px; font:800 clamp(34px, 4.6vw, 52px)/1 var(--display); letter-spacing:-0.035em; }
  header p { margin:0 0 28px; color:var(--muted); font-size:16px; max-width:40em; }
  /* The extension's own accord strip, as on the website. */
  .strip { display:flex; height:8px; }
  .strip i { flex:var(--w) 1 0; background:var(--c); }

  .layout { display:grid; grid-template-columns:minmax(0, 1fr) 360px; gap:32px; padding:32px 0 64px; align-items:start; }
  .preview { position:sticky; top:24px; }
  .preview h2 { font:700 18px/1.2 var(--display); letter-spacing:-0.01em; margin:4px 0 12px; }
  .preview .note { color:var(--muted); font-size:13px; margin:12px 2px 0; }

  /* ---------- sections ---------- */
  section { background:var(--card); border:1px solid var(--line); border-radius:22px; padding:24px 28px; margin-bottom:18px; }
  section > h2, .shead h2 { margin:0 0 4px; font:750 24px/1.15 var(--display); letter-spacing:-0.02em; }
  .hint { margin:0 0 14px; color:var(--muted); font-size:14px; max-width:46em; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:18px; padding:13px 0; border-top:1px solid var(--line); }
  .row.first, .hint + .row { border-top:0; }
  .row .l { min-width:0; }
  .row .l b { display:block; font-weight:600; }
  .row .l span { color:var(--muted); font-size:13.5px; }

  .sw { position:relative; width:44px; height:24px; flex:none; }
  .sw input { opacity:0; width:0; height:0; }
  .sw i { position:absolute; inset:0; background:#dccdd8; border-radius:999px; transition:background .15s; cursor:pointer; }
  .sw i::before { content:''; position:absolute; width:18px; height:18px; left:3px; top:3px; background:#fff; border-radius:50%; transition:transform .15s; box-shadow:0 1px 2px rgba(43,20,38,.25); }
  .sw input:checked + i { background:var(--accent); }
  .sw input:checked + i::before { transform:translateX(20px); }
  .sw input:focus-visible + i { outline:3px solid var(--accent); outline-offset:2px; }

  .seg { display:inline-flex; background:var(--chip); border-radius:999px; padding:4px; flex:none; }
  .seg label { cursor:pointer; }
  .seg input { position:absolute; opacity:0; pointer-events:none; }
  .seg span { display:block; padding:7px 15px; border-radius:999px; font-size:14px; color:var(--muted); white-space:nowrap; }
  .seg input:checked + span { background:var(--accent); color:#fff; font-weight:600; }
  .seg input:focus-visible + span { outline:3px solid var(--accent); outline-offset:1px; }

  .corners { position:relative; width:124px; height:80px; border:2px solid var(--line); border-radius:14px; background:var(--chip); flex:none; }
  .corners label { position:absolute; cursor:pointer; }
  .corners input { position:absolute; opacity:0; pointer-events:none; }
  .corners span { display:block; width:18px; height:18px; border-radius:50%; background:#dccdd8; transition:background .12s; }
  .corners label:hover span { background:var(--soft); }
  .corners input:checked + span { background:var(--accent); box-shadow:0 0 0 4px rgba(126,47,99,.18); }
  .corners input:focus-visible + span { outline:3px solid var(--accent); outline-offset:2px; }
  .corners .tl { top:7px; left:7px; } .corners .tr { top:7px; right:7px; }
  .corners .bl { bottom:7px; left:7px; } .corners .br { bottom:7px; right:7px; }

  .tlabel { font-size:14px; font-weight:600; color:var(--muted); margin:6px 0 10px; }
  .themes + .tlabel { margin-top:18px; }
  .themes { display:grid; grid-template-columns:repeat(auto-fill, minmax(108px, 1fr)); gap:12px; }
  .theme { cursor:pointer; }
  .theme input { position:absolute; opacity:0; pointer-events:none; }
  .theme .card { border:2px solid var(--line); border-radius:16px; overflow:hidden; transition:border-color .12s; }
  .theme input:checked + .card { border-color:var(--accent); box-shadow:0 0 0 4px rgba(126,47,99,.15); }
  .theme input:focus-visible + .card { outline:3px solid var(--accent); outline-offset:2px; }
  .theme .top { height:22px; }
  .theme .mid { padding:9px; display:flex; gap:4px; flex-wrap:wrap; }
  .theme .mid i { height:7px; border-radius:4px; }
  .theme .name { padding:0 9px 9px; font-size:13px; font-weight:600; }

  .shead { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
  .bulk { display:flex; gap:8px; flex:none; }
  .groups { display:flex; flex-direction:column; gap:12px; }
  .group { display:grid; grid-template-columns:30px 1fr; gap:0 14px; border:1px solid var(--line); border-radius:16px; padding:12px 16px; background:#fcf9fb; }
  .group .num { grid-row:1 / span 2; width:28px; height:28px; border-radius:50%; background:var(--accent); color:#fff;
    display:grid; place-items:center; font:700 13px/1 var(--display); margin-top:1px; }
  .group .gh { display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
  .group h3 { margin:0; font:700 16px/1.3 var(--display); }
  .group .where { font-size:13px; color:var(--muted); }
  .group .items { display:grid; grid-template-columns:repeat(auto-fill, minmax(240px, 1fr)); gap:0 22px; }
  .group .row { padding:9px 0; border-top:0; }

  select, .text { padding:9px 14px; border:1.5px solid var(--line); border-radius:12px; font:inherit; font-size:14px; background:#fff; color:var(--fg); }
  select { flex:none; max-width:230px; }
  .text:focus, select:focus { outline:3px solid rgba(126,47,99,.25); border-color:var(--accent); }
  .shortcut { display:flex; gap:8px; flex:none; }
  .shortcut .text { width:160px; text-align:center; font-weight:600; cursor:pointer; caret-color:transparent; }
  .shortcut .text.rec { border-color:var(--accent); background:#faf4f8; }
  button.btn { border:0; box-shadow:inset 0 0 0 1.5px var(--soft); background:#fff; color:var(--accent); border-radius:999px; padding:9px 18px;
    font:600 14px/1 var(--text); cursor:pointer; flex:none; }
  button.btn:hover { background:var(--chip); color:var(--accent-deep); }
  button.btn.sm { padding:7px 14px; font-size:13px; }
  button.primary { background:var(--accent); box-shadow:none; color:#fff; }
  button.primary:hover { background:var(--accent-deep); color:#fff; }
  .btn.danger { color:#a8392a; box-shadow:inset 0 0 0 1.5px #e7c2ba; }
  .btn.danger:hover { background:#fbeeea; color:#8a2d20; }

  .addshop { display:flex; gap:10px; margin:6px 0 14px; }
  .addshop .text { flex:1; min-width:0; }
  .shoplist { display:flex; flex-wrap:wrap; gap:8px; margin:6px 0 4px; }
  .shop { display:inline-flex; align-items:center; gap:6px; padding:5px 6px 5px 12px; border-radius:999px; background:var(--chip); font-size:13.5px; }
  .shop button { border:0; background:none; cursor:pointer; color:var(--muted); font-size:16px; line-height:1; padding:0 5px; }
  .shop button:hover { color:var(--accent); }
  .empty { color:var(--muted); font-size:13.5px; }
  details { margin-top:12px; }
  details summary { cursor:pointer; color:var(--accent); font-size:14px; font-weight:600; }
  .builtin { columns:4 150px; font-size:13px; color:var(--muted); margin-top:10px; }

  .saved { position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px); opacity:0;
    background:var(--fg); color:#fff; padding:10px 18px; border-radius:999px; font-size:14px; font-weight:600; transition:.2s; pointer-events:none; z-index:10; }
  .saved.show { opacity:1; transform:translateX(-50%) translateY(0); }
  @media (prefers-reduced-motion: reduce) { .saved, .sw i, .sw i::before { transition:none; } }

  @media (max-width:900px) { .layout { grid-template-columns:1fr; } .preview { position:static; order:-1; } section { padding:20px; } }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="bar">
      <span class="brand"><img src="icons/128.png" alt="">Fragrance Notes</span>
      <a class="site" href="https://fragrancenotes.app" target="_blank" rel="noopener">fragrancenotes.app</a>
    </div>
    <h1 data-i18n="p_settings"></h1>
    <p data-i18n="headSub"></p>
  </div>
  <div class="strip" aria-hidden="true">
    <i style="--w:100;--c:#fb4b2b"></i><i style="--w:69;--c:#ee3a3d"></i><i style="--w:68;--c:#7a4513"></i><i style="--w:64;--c:#7b4a3c"></i>
    <i style="--w:60;--c:#f6f04e"></i><i style="--w:57;--c:#847586"></i><i style="--w:56;--c:#e5d9ea"></i><i style="--w:52;--c:#9ee6ee"></i>
  </div>
</header>

<div class="wrap layout">
  <main>
    <section>
      <h2 data-i18n="general"></h2>
      <p class="hint" data-i18n="generalHint"></p>
      <div class="row">
        <div class="l"><b data-i18n="langT"></b><span data-i18n="langD"></span></div>
        <select id="lang"></select>
      </div>
      <div class="row">
        <div class="l"><b data-i18n="autoSearchT"></b><span data-i18n="autoSearchD"></span></div>
        <label class="sw"><input type="checkbox" id="autoSearch"><i></i></label>
      </div>
      <div class="row">
        <div class="l"><b data-i18n="openT"></b><span data-i18n="openD"></span></div>
        <div class="seg">
          <label><input type="radio" name="autoOpen" value="false"><span data-i18n="onClick"></span></label>
          <label><input type="radio" name="autoOpen" value="true"><span data-i18n="auto"></span></label>
        </div>
      </div>
      <div class="row">
        <div class="l"><b data-i18n="shortcutT"></b><span data-i18n="shortcutD"></span></div>
        <div class="shortcut"><input class="text" id="shortcut" readonly><button class="btn sm" id="clearShortcut" data-i18n="clear"></button></div>
      </div>
    </section>

    <section>
      <h2 data-i18n="look"></h2>
      <p class="hint" data-i18n="lookHint"></p>
      <div class="row first">
        <div class="l"><b data-i18n="autoT"></b><span data-i18n="autoD"></span></div>
        <label class="sw"><input type="checkbox" id="themeAuto"><i></i></label>
      </div>
      <div class="tlabel" data-i18n="light"></div>
      <div class="themes" id="themesLight"></div>
      <div class="tlabel" data-i18n="dark"></div>
      <div class="themes" id="themesDark"></div>
      <div class="row" style="margin-top:12px; border-top:1px solid var(--line)">
        <div class="l"><b data-i18n="styleT"></b><span data-i18n="styleD"></span></div>
        <div class="seg">
          <label><input type="radio" name="style" value="rich"><span data-i18n="rich"></span></label>
          <label><input type="radio" name="style" value="simple"><span data-i18n="simple"></span></label>
        </div>
      </div>
      <div class="row">
        <div class="l"><b data-i18n="accStyleT"></b><span data-i18n="accStyleD"></span></div>
        <div class="seg">
          <label><input type="radio" name="accStyle" value="strip"><span data-i18n="accStrip"></span></label>
          <label><input type="radio" name="accStyle" value="bars"><span data-i18n="accBars"></span></label>
        </div>
      </div>
    </section>

    <section>
      <h2 data-i18n="panelT"></h2>
      <p class="hint" data-i18n="panelHint"></p>
      <div class="row first">
        <div class="l"><b data-i18n="cornerT"></b><span id="cornerName"></span></div>
        <div class="corners">
          <label class="tl"><input type="radio" name="position" value="tl"><span></span></label>
          <label class="tr"><input type="radio" name="position" value="tr"><span></span></label>
          <label class="bl"><input type="radio" name="position" value="bl"><span></span></label>
          <label class="br"><input type="radio" name="position" value="br"><span></span></label>
        </div>
      </div>
      <div class="row">
        <div class="l"><b data-i18n="sizeT"></b><span data-i18n="sizeD"></span></div>
        <button class="btn" id="resetSize" data-i18n="resetSize"></button>
      </div>
    </section>

    <section>
      <div class="shead">
        <div><h2 data-i18n="show"></h2><p class="hint" data-i18n="showHint"></p></div>
        <div class="bulk"><button class="btn sm" id="allOn" data-i18n="showAll"></button><button class="btn sm" id="allOff" data-i18n="hideAll"></button></div>
      </div>
      <div class="groups" id="sections"></div>
    </section>

    <section>
      <h2 data-i18n="shops"></h2>
      <p class="hint" id="shopsHint"></p>
      <div class="row first">
        <div class="l"><b data-i18n="allSitesT"></b><span data-i18n="allSitesD"></span></div>
        <label class="sw"><input type="checkbox" id="allSites"><i></i></label>
      </div>
      <form class="addshop" id="addShopForm">
        <input class="text" id="shopInput" data-i18n-ph="addShopPh" autocomplete="off">
        <button class="btn primary" data-i18n="add"></button>
      </form>
      <div class="tlabel" data-i18n="yourShops"></div>
      <div class="shoplist" id="customShops"></div>
      <details><summary data-i18n="builtIn"></summary><div class="builtin" id="builtinShops"></div></details>
    </section>

    <section>
      <h2 data-i18n="data"></h2>
      <!-- One switch for both kinds of sharing (prices and the open perfume database); options.js sets both. -->
      <div class="row first">
        <div class="l"><b data-i18n="helpT"></b><span data-i18n="helpD"></span></div>
        <label class="sw"><input type="checkbox" id="shareAll"><i></i></label>
      </div>
      <div class="row">
        <div class="l"><b data-i18n="cacheT"></b><span data-i18n="cacheD"></span></div>
        <button class="btn" id="clearCache" data-i18n="clearCache"></button>
      </div>
      <div class="row">
        <div class="l"><b data-i18n="resetT"></b><span data-i18n="resetD"></span></div>
        <button class="btn danger" id="resetAll" data-i18n="resetBtn"></button>
      </div>
    </section>
  </main>

  <aside class="preview">
    <h2 data-i18n="preview"></h2>
    <div id="previewHost"></div>
    <p class="note" data-i18n="previewNote"></p>
  </aside>
</div>
<div class="saved" id="saved"></div>
<script src="settings.js"></script>
<script src="i18n-panel.js"></script>
<script src="i18n-settings.js"></script>
<script src="panel-ui.js"></script>
<script src="example-data.js"></script>
<script src="options.js"></script>
</body>
</html>
